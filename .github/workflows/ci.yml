name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mod:
    # The mod (hooks/mod/): static validation and its tests run offline, with no sign-in.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the plugin and its hooks module
        run: claude plugin validate .
      - name: Run the mod tests
        run: claude plugin test .
